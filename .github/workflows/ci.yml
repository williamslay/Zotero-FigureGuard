name: CI

# Runs on contribution traffic only: pull requests and pushes to the two
# long-lived branches. Never publishes a release, so a red run cannot affect
# what users download.
on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

# Read-only: CI must not be able to write to the repository or move a release.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build XPI
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@v7 # v7 (node24 runtime)

      - name: Set up Node.js
        uses: actions/setup-node@v7 # v7 (node24 runtime)
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      # Level 1 tests only: the five regression PDFs are copyrighted and are not
      # redistributed, so a clean runner cannot open them. The script fails when
      # anything is cancelled, so nothing can hide behind a skipped test.
      - name: Run unit tests
        run: npm run test:ci

      - name: Build the XPI
        run: npm run build

      - name: Verify the XPI package
        run: node scripts/verify-xpi.mjs

      - name: Upload the XPI artifact
        uses: actions/upload-artifact@v7 # v7 (node24 runtime)
        with:
          name: figure-color-preservation-xpi
          path: |
            dist/figure-color-preservation-*.xpi
            dist/SHA256SUMS.txt
          if-no-files-found: error
