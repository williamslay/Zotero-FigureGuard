name: CI

# One long-lived branch: main. Contribution traffic is a pull request into main,
# plus the push to main after a merge. The internal archive branch (internal)
# holds the pre-open-source history and is not built here. Never publishes a
# release, so a red run cannot affect what users download.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Read-only: CI must not be able to write to the repository or move a release.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build XPI
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@v7 # v7 (node24 runtime)

      - name: Resolve the short commit SHA
        id: short_sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7 # v7 (node24 runtime)
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      # Level 1 tests only: the five regression PDFs are copyrighted and are not
      # redistributed, so a clean runner cannot open them. The script fails when
      # anything is cancelled, so nothing can hide behind a skipped test.
      - name: Run unit tests
        run: npm run test:ci

      - name: Build the XPI
        run: npm run build

      - name: Verify the XPI package
        run: node scripts/verify-xpi.mjs

      # Every merge and every pull request produces a downloadable build, so a
      # test build does not need its own version number. The run number and the
      # short SHA in the artifact name tell the builds apart; the .xpi inside keeps
      # the version from package.json.
      - name: Upload the XPI artifact
        uses: actions/upload-artifact@v7 # v7 (node24 runtime)
        with:
          name: zotero-figure-guard-run${{ github.run_number }}-${{ steps.short_sha.outputs.short }}
          path: |
            dist/zotero-figure-guard-*.xpi
            dist/SHA256SUMS.txt
          if-no-files-found: error
