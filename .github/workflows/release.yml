name: Release

# Publishing is tag driven. One tag means one version, and nothing here bumps a
# version or commits code. A version tag pushed to this repository is a formal
# release. workflow_dispatch is a retry door for a tag that already exists, and
# the only place a pre-release mark can be requested.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish, for example v0.6.0'
        default: v0.6.0
        required: true
        type: string
      prerelease:
        description: 'Mark the published release as a pre-release'
        required: false
        type: boolean
        default: false

# Only the release job gets write access, and only on a controlled version tag.
# The built-in GITHUB_TOKEN is enough: no Personal Access Token is required.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build and publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag name
        run: |
          echo "Publishing tag: $TAG"
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a version tag of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi

      # gh is preinstalled on the runner. Checking the tag through the API turns a
      # mistyped tag into a message that lists the tags which really exist, instead
      # of a confusing checkout error.
      - name: Check that the tag exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null; then
            echo "Tag $TAG exists."
          else
            tags="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
              --jq '[.[].ref | sub("refs/tags/"; "")] | join(", ")')"
            echo "::error::Tag $TAG does not exist on the remote. Existing version tags: $tags"
            exit 1
          fi

      - name: Check out the tagged commit
        # fetch-depth 0 so the job can test whether the tag sits in main's history.
        # The repository is small, so a full clone is cheap.
        uses: actions/checkout@v7 # v7 (node24 runtime)
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Check that the tag belongs to main
        run: |
          set -eu
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          sha="$(git rev-list -n 1 "$TAG")"
          echo "Tag $TAG resolves to $sha"
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "::error::Tag $TAG is not part of main's history. Release from main, not from the internal archive branch."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7 # v7 (node24 runtime)
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

      - name: Build the XPI
        run: npm run build

      # Fails when the tag, package.json, package-lock.json, manifest.json or the
      # archive file name disagree about the version, and writes dist/SHA256SUMS.txt.
      - name: Verify version and XPI package
        run: node scripts/verify-xpi.mjs --expect-version "${TAG#v}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty on a tag push, so a pushed version tag is always a formal release.
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -eu
          version="${TAG#v}"
          xpi="dist/zotero-figure-guard-${version}.xpi"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Refusing to overwrite its assets. Delete it with 'gh release delete $TAG --yes' or publish a new version."
            exit 1
          fi
          args=("$TAG" "$xpi" dist/SHA256SUMS.txt --verify-tag --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
          gh release view "$TAG" --json tagName,isPrerelease,assets \
            --jq '"Published \(.tagName) (prerelease: \(.isPrerelease)) with assets: \([.assets[].name] | join(", "))"'

      - name: Update GitHub Pages updates.json
        if: github.event.inputs.prerelease != 'true'
        run: |
          set -eu
          version="${TAG#v}"
          pages_dir="$(mktemp -d)"
          trap 'git worktree remove --force "$pages_dir" >/dev/null 2>&1 || rm -rf "$pages_dir"' EXIT
          existing_arg=()
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git worktree add --detach "$pages_dir" refs/remotes/origin/gh-pages
            if [ -f "$pages_dir/updates.json" ]; then
              cp "$pages_dir/updates.json" "$pages_dir/.existing-updates.json"
              existing_arg=(--existing "$pages_dir/.existing-updates.json")
            fi
          else
            git worktree add --detach "$pages_dir" HEAD
            git -C "$pages_dir" checkout --orphan gh-pages
            git -C "$pages_dir" rm -rf --ignore-unmatch . >/dev/null
          fi
          node scripts/generate-updates-json.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --expect-version "$version" \
            --dist dist \
            "${existing_arg[@]}" \
            --out "$pages_dir/updates.json"
          rm -f "$pages_dir/.existing-updates.json"
          touch "$pages_dir/.nojekyll"
          git -C "$pages_dir" config user.name "github-actions[bot]"
          git -C "$pages_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$pages_dir" add updates.json .nojekyll
          if git -C "$pages_dir" diff --cached --quiet; then
            echo "updates.json already up to date on gh-pages."
          else
            git -C "$pages_dir" commit -m "chore: publish updates.json for ${TAG}"
            git -C "$pages_dir" push origin HEAD:refs/heads/gh-pages
          fi
